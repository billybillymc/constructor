# 05_fact_mix: identical model and recipe to 03_muon; the only change is the
# training stream, which mixes the chat/fact dialogues (~5%) into pretraining.
# model.py and train.py are byte-identical copies of 03_muon's.

[model]
n_layer = 14
n_head = 8
n_embd = 512
block_size = 512
dropout = 0.05
mlp_hidden = 1408
rope_theta = 10000.0

[train]
seed = 1457
data_dir = "data/processed/fact_mix"
out_dir = "runs"
batch_size = 16
grad_accum_steps = 2
max_steps = 8000
muon_lr = 0.02
muon_momentum = 0.95
muon_ns_steps = 5
muon_weight_decay = 0.01
lr = 5e-4
min_lr_frac = 0.1
warmup_steps = 300
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0
eval_interval = 500
eval_batches = 40
sample_tokens = 250
sample_temperature = 0.8
sample_top_k = 50
