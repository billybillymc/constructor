[project]
name = "latin-lm"
version = "0.1.0"
description = "A small Latin language model trained from scratch, as a testbed for linguistic experiments."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "tokenizers>=0.15",
    "torch>=2.6",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
scrape = "latin_lm.scrape:main"
prepare = "latin_lm.prepare:main"
train = "latin_lm.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latin_lm", "src/loquor"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
